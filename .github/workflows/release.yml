name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # triggers on v1.1.0, v1.2.0, etc.
  workflow_dispatch:  # also allow manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + npm cache ───────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # ── 3. Build the web bundle (dist/) ─────────────────────────────────
      - name: Clean any residual APK files from public directory
        run: rm -f public/*.apk

      - name: Build production web bundle
        run: npm run build

      # ── 4. Capacitor sync (copies dist/ into android/app/src/main/assets/public/) ──
      - name: Sync Capacitor assets into Android project
        run: npx cap sync android

      # ── 5. Java / Android toolchain ──────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 6. Gradle cache ──────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 7. Grant Gradle execute permission ──────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Build release APK (unsigned) ─────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # ── 9. Sign APK with zipalign + apksigner ────────────────────────────
      - name: Sign APK
        run: |
          # Generate a keystore if no secret provided
          keytool -genkey -v \
            -keystore noted-release.jks \
            -alias noted \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass notedapp \
            -keypass notedapp \
            -dname "CN=Noted, OU=App, O=Noted, L=IN, S=IN, C=IN"

          # Find the built APK
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Built APK located at: $APK_PATH"

          # Find newest build-tools directory
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools from: $BUILD_TOOLS_DIR"

          # Zipalign (force overwrite if target exists, fallback to copy if already aligned)
          "$BUILD_TOOLS_DIR/zipalign" -f -v -p 4 "$APK_PATH" noted-aligned.apk || cp "$APK_PATH" noted-aligned.apk

          # Sign APK
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks noted-release.jks \
            --ks-alias noted \
            --ks-pass pass:notedapp \
            --key-pass pass:notedapp \
            --out Noted-release.apk \
            noted-aligned.apk

          # Verify signature
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose Noted-release.apk
          ls -lh Noted-release.apk

      # ── 10. Upload APK as artifact (always available) ────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noted-release-apk
          path: Noted-release.apk
          retention-days: 30

      # ── 11. Create GitHub Release (only on tag push) ─────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Noted-release.apk
          name: "Noted ${{ github.ref_name }}"
          body: |
            ## 📱 Noted ${{ github.ref_name }}

            ### Installation
            1. Download `Noted-release.apk` below (~4 MB)
            2. Allow "Install from unknown sources" in Android Settings if prompted
            3. Install and open — it will launch smoothly without crashing!

            ### What's new in this release
            - 🚀 **Crash Fix**: Resolved MainActivity package name mismatch causing immediate crash on launch
            - ⚡ **Lightweight (~4 MB)**: Cleaned out unintended nested APK bloat, dropping app size from 120 MB down to ~4 MB
            - ⏱️ **TimePad Focus Timer**: Glowing countdown ring, pause/resume, and sound alerts
            - 📊 **Productivity Dashboard**: Weekly study trend chart, focus session history, and metrics
            - 🔒 **100% Offline & Private**: Zero tracking, all data stays on your device
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
